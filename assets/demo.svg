<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace" font-size="15">
  <style>
    .t  { fill: #e8e2d5; }
    .dim{ fill: #8a8375; }
    .acc{ fill: #d08a3a; }
    .ok { fill: #86b076; }
    .l  { opacity: 0; animation-duration: 48s; animation-iteration-count: infinite; animation-timing-function: linear; }

    @keyframes k1  { 1%,21%   { opacity: 1; } 0%,0.5%,23%,100% { opacity: 0; } }
    @keyframes k2  { 4%,21%   { opacity: 1; } 0%,3.5%,23%,100% { opacity: 0; } }
    @keyframes k3  { 8%,21%   { opacity: 1; } 0%,7.5%,23%,100% { opacity: 0; } }
    @keyframes k4  { 12%,21%  { opacity: 1; } 0%,11.5%,23%,100% { opacity: 0; } }
    @keyframes k5  { 16%,21%  { opacity: 1; } 0%,15.5%,23%,100% { opacity: 0; } }

    @keyframes k6  { 25%,46%  { opacity: 1; } 0%,24.5%,48%,100% { opacity: 0; } }
    @keyframes k7  { 28%,46%  { opacity: 1; } 0%,27.5%,48%,100% { opacity: 0; } }
    @keyframes k8  { 34%,46%  { opacity: 1; } 0%,33.5%,48%,100% { opacity: 0; } }
    @keyframes k9  { 39%,46%  { opacity: 1; } 0%,38.5%,48%,100% { opacity: 0; } }

    @keyframes k10 { 50%,71%  { opacity: 1; } 0%,49.5%,73%,100% { opacity: 0; } }
    @keyframes k11 { 56%,71%  { opacity: 1; } 0%,55.5%,73%,100% { opacity: 0; } }
    @keyframes k12 { 59%,71%  { opacity: 1; } 0%,58.5%,73%,100% { opacity: 0; } }
    @keyframes k13 { 64%,71%  { opacity: 1; } 0%,63.5%,73%,100% { opacity: 0; } }
    @keyframes k14 { 67%,71%  { opacity: 1; } 0%,66.5%,73%,100% { opacity: 0; } }

    @keyframes k15 { 75%,97%  { opacity: 1; } 0%,74.5%,99%,100% { opacity: 0; } }
    @keyframes k16 { 80%,97%  { opacity: 1; } 0%,79.5%,99%,100% { opacity: 0; } }
    @keyframes k17 { 84%,97%  { opacity: 1; } 0%,83.5%,99%,100% { opacity: 0; } }
    @keyframes k18 { 90%,97%  { opacity: 1; } 0%,89.5%,99%,100% { opacity: 0; } }

    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .cursor { animation: blink 1.1s step-end infinite; }
  </style>

  <!-- window chrome -->
  <rect width="880" height="460" rx="10" fill="#1b1712"/>
  <circle cx="24" cy="22" r="5.5" fill="#5a5248"/>
  <circle cx="44" cy="22" r="5.5" fill="#5a5248"/>
  <circle cx="64" cy="22" r="5.5" fill="#5a5248"/>
  <text x="440" y="27" text-anchor="middle" class="dim" font-size="12.5">recall — local-first memory for coding agents</text>
  <line x1="0" y1="42" x2="880" y2="42" stroke="#2c2620"/>

  <!-- scene 1: install -->
  <g>
    <text x="32" y="86"  class="t l"  style="animation-name:k1"><tspan class="acc">$</tspan> npx recalld@latest setup</text>
    <text x="32" y="122" class="dim l" style="animation-name:k2">recall setup — everything runs on your machine, nothing is uploaded anywhere</text>
    <text x="32" y="152" class="l" style="animation-name:k3"><tspan class="ok">✓</tspan><tspan class="t"> runtime installed to ~/.recall/app · hooks registered · daemon up</tspan></text>
    <text x="32" y="182" class="l" style="animation-name:k4"><tspan class="ok">✓</tspan><tspan class="t"> 9,333 turns indexed · 12 secrets redacted before storage</tspan></text>
    <text x="32" y="224" class="t l" style="animation-name:k5">Done. Your agent now has memory.</text>
  </g>

  <!-- scene 2: injection -->
  <g>
    <text x="32" y="86"  class="dim l" style="animation-name:k6"># claude code</text>
    <text x="32" y="122" class="t l"  style="animation-name:k7"><tspan class="acc">&gt;</tspan> why did we switch the webhook handler to idempotency keys?</text>
    <text x="32" y="164" class="acc l" style="animation-name:k8">recall: injected 2 snippets</text>
    <text x="32" y="206" class="dim l" style="animation-name:k9">⏺ Because Stripe retries on timeout — you hit double-charges in May and</text>
    <text x="32" y="230" class="dim l" style="animation-name:k9">  decided to store event ids with a unique constraint. Same fix applies here.</text>
  </g>

  <!-- scene 3: cross-agent -->
  <g>
    <text x="32" y="86"  class="t l"  style="animation-name:k10"><tspan class="acc">$</tspan> codex exec "note: staging deploys need the VPN up first"</text>
    <text x="32" y="128" class="dim l" style="animation-name:k11"># claude code — new session, next day</text>
    <text x="32" y="164" class="t l"  style="animation-name:k12"><tspan class="acc">&gt;</tspan> anything special before I deploy to staging?</text>
    <text x="32" y="206" class="acc l" style="animation-name:k13">recall: injected 1 snippet</text>
    <text x="32" y="248" class="dim l" style="animation-name:k14">⏺ Yes — your Codex session yesterday noted staging deploys need the VPN up.</text>
  </g>

  <!-- scene 4: redaction -->
  <g>
    <text x="32" y="86"  class="t l"  style="animation-name:k15"><tspan class="acc">$</tspan> recalld redact --dry-run</text>
    <text x="32" y="128" class="t l"  style="animation-name:k16">[dry-run] Would redact 12 secret(s) across 11 of 9,161 turns</text>
    <text x="32" y="158" class="dim l" style="animation-name:k17">(anthropic-key: 7, jwt: 3, generic-assignment: 2)</text>
    <text x="32" y="212" class="acc l" style="animation-name:k18">one memory across your agents. nothing ever leaves your machine.</text>
  </g>

  <!-- footer -->
  <line x1="0" y1="416" x2="880" y2="416" stroke="#2c2620"/>
  <text x="32" y="441" class="dim" font-size="12.5">npx recalld@latest setup</text>
  <rect x="222" y="429" width="8" height="14" fill="#d08a3a" class="cursor"/>
  <text x="848" y="441" text-anchor="end" class="dim" font-size="12.5">github.com/CarterH2101/recall</text>
</svg>
