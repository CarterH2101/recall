name: Eval gate

on:
  pull_request:
    paths: ["src/**", "eval/**"]
  push:
    branches: [main]
    paths: ["src/**", "eval/**"]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/eval-ci.mjs
