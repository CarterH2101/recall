<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>recall</title>
<style>
  :root {
    /* Light, airy, techy — shared scheme with the recall console:
       cool-gray wash, white surfaces, navy ink, indigo-blue accent. */
    --paper:   oklch(97.6% 0.005 250);
    --surface: oklch(99.4% 0.002 250);
    --ink:     oklch(26% 0.035 265);
    --ink-2:   oklch(45% 0.022 262);
    --ink-3:   oklch(60% 0.016 258);
    --rule:    oklch(91.5% 0.009 255);
    --accent:  oklch(52% 0.19 265);
    --accent-soft: oklch(94% 0.03 262);
    --k-decision:   oklch(52% 0.19 265);
    --k-gotcha:     oklch(56% 0.15 38);
    --k-preference: oklch(54% 0.15 305);
    --k-reference:  oklch(52% 0.12 158);
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    --sans: system-ui, "Segoe UI", -apple-system, sans-serif;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --shadow: 0 1px 2px oklch(30% 0.03 260 / 0.06), 0 4px 16px oklch(30% 0.03 260 / 0.05);
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font: 14px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: baseline; gap: 20px;
    max-width: 1080px; margin: 0 auto; padding: 26px 24px 0;
  }
  .wordmark { font: 600 16px/1 var(--mono); letter-spacing: -0.01em; }
  .wordmark::after {
    content: ""; display: inline-block; width: 7px; height: 13px;
    background: var(--accent); margin-left: 3px; transform: translateY(1px);
    border-radius: 1.5px;
  }
  #db-path {
    font: 11px/1 var(--mono); color: var(--ink-3);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 34ch; direction: rtl;
  }
  nav { display: flex; gap: 22px; margin-left: auto; }
  nav a {
    font: 500 11px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3); text-decoration: none; cursor: pointer;
    padding: 6px 1px 10px; border-bottom: 2px solid transparent;
    transition: color 150ms var(--ease), border-color 150ms var(--ease);
  }
  nav a:hover { color: var(--ink); }
  nav a.active { color: var(--ink); border-bottom-color: var(--accent); }
  nav a:focus-visible, .act:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 1px;
  }
  .headrule { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
  .headrule hr { border: 0; border-top: 1px solid var(--rule); margin: 0; }

  main { max-width: 1080px; margin: 0 auto; padding: 26px 24px 60px; }
  .view { animation: arrive 200ms var(--ease); }
  @keyframes arrive { from { opacity: 0; transform: translateY(5px); } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---------- primitives ---------- */
  .label {
    font: 500 10.5px/1 var(--mono); letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .mono  { font-family: var(--mono); font-size: 12px; }
  .dim   { color: var(--ink-3); }
  .quiet { color: var(--ink-2); }
  a.link { color: var(--accent); text-decoration: none; cursor: pointer; }
  a.link:hover { text-decoration: underline; text-underline-offset: 3px; }

  section { margin-bottom: 38px; }
  section > .label { display: block; margin-bottom: 14px; }

  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; padding: 0 14px 8px 0; font-weight: 500; }
  th.label { font-size: 10.5px; }
  td { padding: 9px 14px 9px 0; border-top: 1px solid var(--rule); vertical-align: baseline; }
  tr.rowlink { cursor: pointer; transition: background 150ms var(--ease); }
  tr.rowlink:hover td { background: var(--surface); }

  .act {
    font: 500 11.5px/1 var(--mono); color: var(--ink-2);
    background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
    padding: 4px 10px; cursor: pointer;
    transition: color 150ms var(--ease), border-color 150ms var(--ease), box-shadow 150ms var(--ease);
  }
  .act:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 1px 6px oklch(52% 0.19 265 / 0.15); }
  .act:disabled { color: color-mix(in oklch, var(--ink-3) 45%, transparent); border-color: var(--rule); cursor: default; }

  input[type=text], select, textarea {
    font: 13px/1.5 var(--sans); color: var(--ink);
    background: var(--surface); border: 1px solid var(--rule); border-radius: 7px;
    padding: 9px 12px; transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
  }
  input[type=text]:hover, textarea:hover, select:hover { border-color: var(--ink-3); }
  input[type=text]:focus, textarea:focus, select:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none;
  }

  .kind { font: 500 11.5px/1 var(--mono); white-space: nowrap; }
  .kind::before {
    content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 6px; transform: translateY(-1px); background: var(--ink-3);
  }
  .kind.decision::before   { background: var(--k-decision); }
  .kind.gotcha::before     { background: var(--k-gotcha); }
  .kind.preference::before { background: var(--k-preference); }
  .kind.reference::before  { background: var(--k-reference); }

  .empty { color: var(--ink-2); padding: 26px 0; }
  .empty .mono { color: var(--ink); }

  /* ---------- stats ledger ---------- */
  .ledger {
    display: flex; flex-wrap: wrap; margin-bottom: 38px;
    background: var(--surface); border: 1px solid var(--rule); border-radius: 12px;
    padding: 4px 22px; box-shadow: var(--shadow);
  }
  .ledger > div {
    flex: 1 1 auto; padding: 16px 22px 16px 0; min-width: 108px;
  }
  .ledger > div + div { padding-left: 22px; border-left: 1px solid var(--rule); }
  .ledger .n { font: 500 19px/1.2 var(--mono); letter-spacing: -0.01em; }
  .ledger .label { display: block; margin-top: 5px; }

  svg.chart { display: block; max-width: 100%; height: auto; }
  .bar { fill: var(--accent); fill-opacity: 0.85; transition: fill-opacity 150ms var(--ease); }
  .bar:hover { fill-opacity: 1; }
  .axis { font: 10px var(--mono); fill: var(--ink-3); }

  /* ---------- search ---------- */
  #q { width: 100%; font-size: 15px; padding: 12px 14px; }
  .hint { font: 11px var(--mono); color: var(--ink-3); margin: 8px 2px 0; }
  .result { padding: 16px 0; border-top: 1px solid var(--rule); }
  .result:first-child { border-top: 0; }
  .result .meta { display: flex; gap: 14px; align-items: baseline; margin-bottom: 6px; }
  .snip { white-space: pre-wrap; word-break: break-word; color: var(--ink-2); }
  .result .snip { color: var(--ink); }
  .score { font: 12px var(--mono); color: var(--ink-3); }

  /* ---------- facts ---------- */
  .addrow { display: flex; gap: 10px; margin-bottom: 22px; }
  .addrow input { flex: 1; }
  .fact-content { max-width: 58ch; }
  .editbox { width: 100%; min-height: 72px; font-family: var(--sans); resize: vertical; }
  .editactions { display: flex; gap: 8px; margin-top: 8px; }
  .flag { color: var(--accent); font-family: var(--mono); }

  @media (max-width: 720px) {
    header { flex-wrap: wrap; row-gap: 10px; }
    nav { width: 100%; margin-left: 0; gap: 16px; }
    #db-path { display: none; }
    .ledger > div { min-width: 33%; border-left: 0 !important; padding-left: 0 !important; }
    td, th { padding-right: 10px; }
  }
</style>
</head>
<body>
<header>
  <span class="wordmark">recall</span>
  <span id="db-path" class="mono"></span>
  <nav id="tabs"></nav>
</header>
<div class="headrule"><hr></div>
<main id="main"></main>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const api = async (path, opts) => {
  const r = await fetch(path, opts ? { headers: {"Content-Type":"application/json"}, ...opts } : undefined);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error ?? r.status);
  return r.json();
};
const fmtDay = (ts) => (ts ?? "").slice(0, 10);
const fmtWhen = (ts) => (ts ?? "").slice(0, 16).replace("T", " ");

const TABS = { search: "Search", sessions: "Sessions", facts: "Facts", activity: "Activity", stats: "Stats" };
let tab = location.hash.slice(1) || "stats";
if (!TABS[tab]) tab = "stats";

function renderTabs() {
  $("#tabs").innerHTML = Object.entries(TABS)
    .map(([k, label]) => `<a class="${k === tab ? "active" : ""}" onclick="go('${k}')" tabindex="0">${label}</a>`)
    .join("");
}
window.go = (t) => { tab = t; location.hash = t; renderTabs(); views[t](); };
window.addEventListener("hashchange", () => {
  const t = location.hash.slice(1);
  if (TABS[t] && t !== tab) { tab = t; renderTabs(); views[t](); }
});
const mount = (html) => { $("#main").innerHTML = `<div class="view">${html}</div>`; };

const views = {};

/* ---------------- stats ---------------- */
views.stats = async () => {
  const s = await api("/api/stats");
  $("#db-path").textContent = s.dbPath;
  const inj = s.hookLast7d;
  const injRate = inj.recalls ? Math.round((100 * inj.injecting) / inj.recalls) + "%" : "–";

  const figures = [
    [s.turns.toLocaleString(), "turns"],
    [s.embedded.toLocaleString(), "embedded"],
    [s.sessions.toLocaleString(), "sessions"],
    [String(s.facts), "facts"],
    [String(s.redactedTurns), "redacted"],
    [s.dbSizeMb + " MB", "on disk"],
    [injRate, "prompts injected, 7d"],
  ];

  const max = Math.max(1, ...s.turnsPerDay.map((d) => d.n));
  const w = 18, gap = 6, h = 130, pad = 16;
  const svgW = Math.max(1, s.turnsPerDay.length * (w + gap) - gap);
  const bars = s.turnsPerDay.map((d, i) => {
    const bh = Math.max(2, Math.round((d.n / max) * (h - 34)));
    // Clamp edge labels into the canvas so the first/last dates don't clip.
    const lx = Math.min(Math.max(i * (w + gap) + w / 2, 17), svgW - 17);
    const label = i % 5 === 0
      ? `<text class="axis" x="${lx}" y="${h - 2}" text-anchor="middle">${d.day.slice(5)}</text>`
      : "";
    return `<rect class="bar" x="${i * (w + gap)}" y="${h - pad - bh}" width="${w}" height="${bh}" rx="2"><title>${d.day} · ${d.n} turns</title></rect>${label}`;
  }).join("");

  mount(`
    <div class="ledger">
      ${figures.map(([n, k]) => `<div><span class="n">${n}</span><span class="label">${k}</span></div>`).join("")}
    </div>
    <section>
      <span class="label">Turns per day, last 30 days</span>
      ${s.turnsPerDay.length
        ? `<svg class="chart" width="${svgW}" height="${h}" viewBox="0 0 ${svgW} ${h}" role="img" aria-label="Turns captured per day">${bars}</svg>`
        : `<div class="empty">No turns in the last 30 days.</div>`}
    </section>
    <section>
      <span class="label">Sessions by source</span>
      <table style="max-width:380px">
        ${s.bySource.map((r) => `<tr><td class="mono">${esc(r.source_agent)}</td><td class="mono" style="text-align:right">${r.n.toLocaleString()}</td></tr>`).join("")}
      </table>
    </section>
    <section id="team-section"></section>
  `);
  api("/api/team").then((t) => {
    if (!t.members.length) return;
    $("#team-section").innerHTML = `
      <span class="label">Team · names decrypted locally, the hub cannot render this list</span>
      <table style="max-width:520px">
        ${t.members.map((m) => `
          <tr><td>${m.status === "revoked" ? "✗" : "•"} ${esc(m.name ?? "(unnamed)")}</td>
          <td class="mono dim">${esc(m.member_id.slice(0, 10))}…</td>
          <td class="mono dim">${esc(m.role)}${m.status === "revoked" ? " · revoked" : ""}</td></tr>`).join("")}
      </table>`;
  }).catch(() => {});
};

/* ---------------- search ---------------- */
views.search = () => {
  mount(`
    <section>
      <input type="text" id="q" placeholder="Search your memory" autocomplete="off">
      <div class="hint">enter to search · facts rank first · scores are cosine similarity</div>
    </section>
    <div id="results"></div>
  `);
  const q = $("#q");
  q.focus();
  q.onkeydown = async (e) => {
    if (e.key !== "Enter" || !q.value.trim()) return;
    $("#results").innerHTML = `<div class="empty">Searching…</div>`;
    try {
      const r = await api("/recall", { method: "POST", body: JSON.stringify({ query: q.value, limit: 8, source: "ui" }) });
      $("#results").innerHTML = r.snippets.length
        ? r.snippets.map((s) => `
          <div class="result">
            <div class="meta">
              ${s.kind === "fact"
                ? `<span class="kind ${esc(s.factKind)}">${esc(s.factKind)}</span>`
                : `<span class="mono dim">${esc(s.role)}</span>`}
              <span class="score">${s.score.toFixed(3)}</span>
              <span class="mono dim">${fmtDay(s.ts)}${s.project ? " · " + esc(s.project) : ""}</span>
            </div>
            <div class="snip">${esc(s.content)}</div>
          </div>`).join("")
        : `<div class="empty">Nothing scored above the floor for that query.</div>`;
    } catch (err) {
      $("#results").innerHTML = `<div class="empty">Search failed: ${esc(err.message)}</div>`;
    }
  };
};

/* ---------------- sessions ---------------- */
views.sessions = async () => {
  const rows = await api("/api/sessions?limit=100");
  mount(`
    <section>
      <span class="label">Recent sessions</span>
      <table>
        <tr><th class="label">when</th><th class="label">source</th><th class="label">project</th><th class="label">branch</th><th class="label" style="text-align:right">turns</th></tr>
        ${rows.map((r) => `
          <tr class="rowlink" onclick="showSession('${esc(r.id)}')">
            <td class="mono dim" style="white-space:nowrap">${fmtWhen(r.last_seen_at)}</td>
            <td class="mono">${esc(r.source_agent)}</td>
            <td>${esc(r.project ?? "")}</td>
            <td class="mono dim">${esc(r.git_branch ?? "")}</td>
            <td class="mono" style="text-align:right">${r.turn_count}</td>
          </tr>`).join("")}
      </table>
    </section>
    <div id="session-detail"></div>
  `);
};
window.showSession = async (id) => {
  const turns = await api(`/api/sessions/${encodeURIComponent(id)}/turns`);
  $("#session-detail").innerHTML = `
    <section class="view">
      <span class="label">Session <span class="mono">${esc(id)}</span></span>
      ${turns.map((t) => `
        <div class="result">
          <div class="meta">
            <span class="mono">${esc(t.role)}</span>
            <span class="mono dim">${(t.ts ?? "").slice(11, 19)}</span>
            ${t.redaction_count ? `<span class="mono flag">${t.redaction_count} redacted</span>` : ""}
            <button class="act" onclick="blockTurn(${t.rowid}, this)" title="Remove from the search index; it will never be injected again">never inject</button>
          </div>
          <div class="snip">${esc(t.content.slice(0, 600))}${t.content.length > 600 ? "…" : ""}</div>
        </div>`).join("")}
    </section>`;
  $("#session-detail").scrollIntoView({ behavior: "smooth", block: "start" });
};
window.blockTurn = async (rowid, btn) => {
  await api(`/api/turns/${rowid}/block`, { method: "POST", body: "{}" });
  btn.textContent = "blocked";
  btn.disabled = true;
};

/* ---------------- facts ---------------- */
views.facts = async (archived = 0) => {
  const facts = await api(`/api/facts?archived=${archived}`);
  mount(`
    <div class="addrow">
      <select id="new-kind" aria-label="Fact kind">
        <option>decision</option><option>gotcha</option><option>preference</option><option>reference</option>
      </select>
      <input type="text" id="new-content" placeholder="Add a fact" autocomplete="off">
      <button class="act" onclick="addFact()">add</button>
    </div>
    <section>
      <span class="label">${archived ? "Archived facts" : "Facts"}
        <a class="link" style="float:right" onclick="views.facts(${archived ? 0 : 1})">${archived ? "back to active" : "view archived"}</a>
      </span>
      <table>
        <tr><th class="label">kind</th><th class="label">fact</th><th class="label">project</th><th class="label">updated</th><th></th></tr>
        ${facts.map((f) => {
          const sid = f.id.slice(0, 8);
          return `
          <tr id="row-${sid}">
            <td><span class="kind ${esc(f.kind)}">${esc(f.kind)}</span></td>
            <td class="fact-content">
              ${f.pinned ? `<span class="flag" title="pinned">▪ </span>` : ""}<span id="fc-${sid}">${esc(f.content)}</span>
              ${f.via ? `<div class="mono dim" style="margin-top:3px">via ${esc(f.via)}${f.label_net ? ` · ${f.label_net > 0 ? "+" : ""}${f.label_net} useful` : ""}</div>` : ""}
              <div id="ed-${sid}"></div>
            </td>
            <td class="mono dim">${esc(f.project ?? "")}</td>
            <td class="mono dim" style="white-space:nowrap">${fmtDay(f.updated_at)}</td>
            <td style="white-space:nowrap; text-align:right">
              ${f.via ? `<button class="act" onclick="labelFact('${f.id}','useful',this)">useful</button>
              <button class="act" onclick="labelFact('${f.id}','noise',this)">noise</button>` : ""}
              <button class="act" onclick="editFactUi('${f.id}','${sid}')">edit</button>
              <button class="act" onclick="patchFact('${f.id}',{pinned:${!f.pinned}})">${f.pinned ? "unpin" : "pin"}</button>
              <button class="act" onclick="patchFact('${f.id}',{archived:${!archived}})">${archived ? "restore" : "archive"}</button>
            </td>
          </tr>`;
        }).join("")}
      </table>
      ${facts.length ? "" : `<div class="empty">No ${archived ? "archived " : ""}facts yet. Promote some from history with <span class="mono">recalld distill</span>.</div>`}
    </section>
  `);
};
window.addFact = async () => {
  const content = $("#new-content").value.trim();
  if (!content) return;
  await api("/api/facts", { method: "POST", body: JSON.stringify({ kind: $("#new-kind").value, content }) });
  views.facts();
};
window.patchFact = async (id, patch) => {
  await api(`/api/facts/${id}`, { method: "PATCH", body: JSON.stringify(patch) });
  views.facts();
};
window.labelFact = async (id, verdict, btn) => {
  await api(`/api/facts/${id}/label`, { method: "POST", body: JSON.stringify({ verdict }) });
  btn.textContent = verdict + " ✓";
  btn.disabled = true;
};
window.editFactUi = (id, sid) => {
  const span = $(`#fc-${sid}`);
  const holder = $(`#ed-${sid}`);
  if (!span || holder.childElementCount) return;
  const current = span.textContent;
  span.style.display = "none";
  holder.innerHTML = `
    <textarea class="editbox" id="ta-${sid}">${esc(current)}</textarea>
    <div class="editactions">
      <button class="act" onclick="saveFactEdit('${id}','${sid}')">save, re-embeds</button>
      <button class="act" onclick="cancelFactEdit('${sid}')">cancel</button>
    </div>`;
  const ta = $(`#ta-${sid}`);
  ta.focus();
  ta.setSelectionRange(current.length, current.length);
};
window.saveFactEdit = async (id, sid) => {
  const next = $(`#ta-${sid}`).value.trim();
  const current = $(`#fc-${sid}`).textContent;
  if (next && next !== current) await window.patchFact(id, { content: next });
  else window.cancelFactEdit(sid);
};
window.cancelFactEdit = (sid) => {
  $(`#ed-${sid}`).innerHTML = "";
  $(`#fc-${sid}`).style.display = "";
};

/* ---------------- activity ---------------- */
views.activity = async () => {
  const rows = await api("/api/injections?limit=60");
  mount(`
    <section>
      <span class="label">What recall did recently</span>
      <table>
        <tr><th class="label">when</th><th class="label">via</th><th class="label">query</th><th class="label" style="text-align:right">injected</th><th class="label">top</th><th class="label">verdict</th></tr>
        ${rows.map((r) => `
          <tr>
            <td class="mono dim" style="white-space:nowrap">${esc(r.ts.slice(5, 16).replace("T", " "))}</td>
            <td class="mono dim">${esc(r.source)}</td>
            <td class="quiet" style="max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${esc(r.query.slice(0, 160))}</td>
            <td class="mono" style="text-align:right">${r.n_injected}</td>
            <td class="score">${r.top_score ?? ""}</td>
            <td style="white-space:nowrap">${r.n_injected ? `
              <button class="act" onclick="labelInj(${r.id},'relevant',this)">useful</button>
              <button class="act" onclick="labelInj(${r.id},'irrelevant',this)">noise</button>` : ""}</td>
          </tr>`).join("")}
      </table>
      ${rows.length ? `<div class="hint">verdicts append to ~/.recall/eval/labels.jsonl and feed the eval set</div>`
                    : `<div class="empty">No recalls logged yet. They appear here as your agents work.</div>`}
    </section>
  `);
};
window.labelInj = async (id, verdict, btn) => {
  await api(`/api/injections/${id}/label`, { method: "POST", body: JSON.stringify({ verdict }) });
  btn.parentElement.innerHTML = `<span class="mono dim">${verdict === "relevant" ? "useful" : "noise"} ✓</span>`;
};

renderTabs();
views[tab]();
</script>
</body>
</html>
